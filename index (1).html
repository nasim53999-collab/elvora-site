<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELVORA – live preview</title>
<style>
:root{--bg:#f6f8f7;--surf:#fff;--ink:#14231f;--mut:#5b6b66;--line:#d9e2de;--acc:#0f7b6c;--accink:#fff;--dang:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1815;--surf:#16241f;--ink:#e8f1ee;--mut:#98aaa4;--line:#26382f;--acc:#3cc4ad;--accink:#06231d;--dang:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1815;--surf:#16241f;--ink:#e8f1ee;--mut:#98aaa4;--line:#26382f;--acc:#3cc4ad;--accink:#06231d;--dang:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:1.8rem}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{font:700 1.3rem Georgia,serif;text-decoration:none}
nav a{margin-left:16px;text-decoration:none;color:var(--mut);padding:4px 0;border-bottom:2px solid transparent}
nav a.on,nav a:hover{color:var(--ink);border-color:var(--acc)}
.btn{display:inline-block;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:10px 18px;font:600 .95rem system-ui;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.85rem}.btn.del{background:transparent;color:var(--dang);border:1px solid var(--dang)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{padding:64px 0 48px}.hero p{max-width:56ch;color:var(--mut);font-size:1.1rem}
section.blk{padding:36px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card .img{aspect-ratio:4/3;background:linear-gradient(135deg,var(--line),var(--bg));display:grid;place-items:center;font-size:3rem}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .b{padding:14px}.price{font-weight:700;color:var(--acc)}
.mut{color:var(--mut)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:720px){.two{grid-template-columns:1fr}nav a{margin-left:10px}}
footer{border-top:1px solid var(--line);margin-top:40px;padding:24px 0;color:var(--mut);font-size:.9rem}
.note{background:var(--surf);border:1px dashed var(--acc);border-radius:8px;padding:10px 14px;font-size:.88rem;margin:16px 0}
.admin{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:28px 0}
@media(max-width:720px){.admin{grid-template-columns:1fr}}
.side a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--mut)}
.side a.on{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:16px}.stat b{font:700 2rem Georgia,serif;display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.pill{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}.pill.live{border-color:var(--acc);color:var(--acc)}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--line);display:inline-grid;place-items:center}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
.login{max-width:380px;margin:60px auto}
.owner{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:start}.owner img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.owner p{max-width:62ch}@media(max-width:720px){.owner{grid-template-columns:1fr}.owner img{max-width:260px}}.grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.pc{display:flex;flex-direction:column}.pc .img{aspect-ratio:16/10;font-size:3.5rem}.pc .b{display:flex;flex-direction:column;flex:1;padding:18px}.pc h3{font-size:1.2rem;margin:0 0 4px}.pc p{margin:0 0 10px}.pc ul{margin:0 0 16px;padding-left:18px;color:var(--mut);font-size:.92rem}.pc .pf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.pc .price{font-size:1.1rem}
.hero2{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0 24px}.hero2 p{color:var(--mut);font-size:1.1rem;max-width:52ch}.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.heroimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:12px}.hl{border-left:3px solid var(--acc);padding:4px 0 4px 16px}.hl h3{font-size:1.1rem;margin-bottom:4px}.hl p{margin:0}
.owner2{display:grid;grid-template-columns:120px 1fr;gap:24px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:24px;margin:20px 0}.owner2 img{width:120px;height:120px;border-radius:50%;object-fit:cover}.owner2 h2{margin:0}.owner2 p{margin:6px 0 12px;max-width:62ch}
.band{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--acc);color:var(--accink);border-radius:14px;padding:28px;margin:28px 0}.band h2{margin:0 0 4px}.band p{margin:0}.band .btn{background:var(--accink);color:var(--acc)}
@media(max-width:720px){.hero2{grid-template-columns:1fr;padding-top:32px}.owner2{grid-template-columns:1fr}}
</style></head><body>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n>0?'৳'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2}):'Request a quote';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const pimg=p=>p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:esc(p.emoji||'📦');
function card(p){const it=(p.items||[]).length?`<ul>${p.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:'';return `<div class="card pc"><div class="img">${pimg(p)}</div><div class="b"><h3>${esc(p.name)}</h3><p class="mut">${esc(p.desc)}</p>${it}<div class="pf"><span class="price">${money(p.price)}</span><a class="btn sm ghost" href="#contact">Get a quote</a></div></div></div>`}
function pub(){return D.products.filter(p=>p.pub)}
const pages={
home(){const c=D.content,p=pub(),hi=(p.find(x=>x.img)||{}).img;
return `<div class="wrap"><div class="hero2"><div><h1>${esc(c.heroT)}</h1><p>${esc(c.heroS)}</p><div class="cta"><a class="btn" href="#shop">See our products</a><a class="btn ghost" href="#contact">Contact us</a></div></div>${hi?`<img class="heroimg" src="${hi}" alt="${esc(c.brand)} dashboard preview">`:''}</div>
<section class="blk"><div class="sh"><h2>Our products</h2><a href="#shop">View all</a></div>${p.length?`<div class="grid">${p.map(card).join('')}</div>`:'<p class="mut">No published products yet.</p>'}</section>
<section class="blk"><h2>Why businesses choose ${esc(c.brand)}</h2><div class="three"><div class="hl"><h3>Save time</h3><p class="mut">Automation takes over repetitive tasks so your team can focus on customers.</p></div><div class="hl"><h3>Serve customers better</h3><p class="mut">Chatbots, booking and support that respond around the clock.</p></div><div class="hl"><h3>Grow with confidence</h3><p class="mut">Websites, systems and branding built to scale with your business.</p></div></div></section>
<div class="owner2"><img src="${c.ownerPhoto}" alt="${esc(c.ownerName)}"><div><h2>${esc(c.ownerName)}</h2><p class="mut">Owner of ${esc(c.brand)}</p><p>${esc(String(c.ownerBio).split('\n')[0])}</p><a class="btn ghost sm" href="#about">Read more</a></div></div>
<div class="band"><div><h2>Ready to get started?</h2><p>Tell us about your business and we will reply within one working day.</p></div><a class="btn" href="#contact">Contact us</a></div></div>`},
about(){const c=D.content;return `<div class="wrap"><section class="blk"><h1>${esc(c.aboutT)}</h1><p style="max-width:62ch">${esc(c.aboutB)}</p><h2 style="margin-top:32px">Mission</h2><p class="mut" style="max-width:62ch">${esc(c.mission)}</p></section>
<section class="blk owner"><img src="${c.ownerPhoto}" alt="${esc(c.ownerName)}, owner of ${esc(c.brand)}"><div><h2>${esc(c.ownerName)}</h2><p class="mut">Owner of ${esc(c.brand)}</p>${String(c.ownerBio).split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div></section></div>`},
shop(){const p=pub();return `<div class="wrap"><section class="blk"><h1>Products</h1>${p.length?`<div class="grid">${p.map(card).join('')}</div>`:'<p class="mut">No products are published right now.</p>'}</section></div>`},
contact(){const c=D.content;return `<div class="wrap"><section class="blk two"><div><h1>Contact Us</h1><form id="cf"><label for="n">Name</label><input id="n" required><label for="e">Email</label><input id="e" type="email" required><label for="m">Message</label><textarea id="m" rows="5" required></textarea><p><button class="btn" type="submit">Send message</button></p></form></div>
<div><h2>Find us</h2><p>${esc(c.address)}<br>${esc(c.phone)}<br>${esc(c.email)}</p><p class="mut">${esc(c.hours)}</p></div></section></div>`},
admin(){if(!S.auth)return `<div class="wrap"><form class="login card" id="lf"><div class="b"><h2>Admin login</h2><div class="note">Demo preview login:<br><b>admin@cleanbiz.demo</b> / <b>admin123</b></div><label for="le">Email</label><input id="le" type="email" required><label for="lp">Password</label><input id="lp" type="password" required><p><button class="btn" type="submit">Log in</button></p></div></form></div>`;
const tabs=[['overview','Overview'],['products','Products'],['content','Website content'],['messages','Messages ('+D.messages.length+')']];
return `<div class="wrap"><div class="admin"><aside class="side">${tabs.map(t=>`<a href="#" data-tab="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}</a>`).join('')}<a href="#" data-act="logout">Log out</a></aside><div>${adminTab()}</div></div></div>`}};
function adminTab(){const t=S.tab;
if(t==='overview')return `<h2>Dashboard</h2><div class="stats"><div class="stat"><b>${D.products.length}</b>Products</div><div class="stat"><b>${pub().length}</b>Published</div><div class="stat"><b>${D.products.length-pub().length}</b>Unpublished</div><div class="stat"><b>${D.messages.length}</b>Messages</div></div><p class="mut">Changes you make here appear on the public pages immediately. <a href="#shop">View products</a></p>`;
if(t==='products'){if(S.edit!==null){const p=S.edit===0?{name:'',price:'',desc:'',emoji:'📦',img:'',pub:true}:D.products.find(x=>x.id===S.edit);return `<h2>${S.edit===0?'Add product':'Edit product'}</h2><form id="pf"><label for="pn">Name</label><input id="pn" required value="${esc(p.name)}"><label for="pp">Price (BDT, 0 = request a quote)</label><input id="pp" type="number" step="0.01" min="0" required value="${esc(p.price)}"><label for="pd">Description</label><textarea id="pd" rows="3">${esc(p.desc)}</textarea><label for="pi">Services included (one per line)</label><textarea id="pi" rows="4">${esc((p.items||[]).join('\n'))}</textarea><label for="pf2">Product image</label><input id="pf2" type="file" accept="image/*"><div id="pv" style="margin:8px 0"><span class="thumb" style="width:80px;height:80px">${pimg(S.img?{img:S.img,name:''}:p)}</span></div><label><input type="checkbox" id="pu" style="width:auto" ${p.pub?'checked':''}> Published</label><p><button class="btn" type="submit">Save product</button> <a class="btn ghost" href="#" data-act="cancel">Cancel</a></p></form>`}
return `<h2>Products</h2><p><a class="btn" href="#" data-act="new">Add product</a></p><div class="tw"><table><tr><th></th><th>Name</th><th>Price</th><th>Status</th><th></th></tr>${D.products.map(p=>`<tr><td><span class="thumb">${pimg(p)}</span></td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td><span class="pill ${p.pub?'live':''}">${p.pub?'Published':'Draft'}</span></td><td><button class="btn ghost sm" data-act="tog" data-id="${p.id}">${p.pub?'Unpublish':'Publish'}</button> <button class="btn ghost sm" data-act="edit" data-id="${p.id}">Edit</button> <button class="btn del sm" data-act="delp" data-id="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`}
if(t==='content'){const c=D.content,f=(k,l,r)=>`<label for="c_${k}">${l}</label>${r?`<textarea id="c_${k}" rows="${r}">${esc(c[k])}</textarea>`:`<input id="c_${k}" value="${esc(c[k])}">`}`;
return `<h2>Website content</h2><form id="wf">${f('brand','Site name')}${f('heroT','Home heading')}${f('heroS','Home text',2)}${f('aboutT','About heading')}${f('aboutB','About text',4)}${f('mission','Mission',2)}${f('ownerName','Owner name')}${f('ownerBio','Owner bio (one paragraph per line)',9)}${f('email','Email')}${f('phone','Phone')}${f('address','Address')}${f('hours','Opening hours')}<p><button class="btn" type="submit">Save changes</button></p></form>`}
return `<h2>Contact messages</h2>${D.messages.length?D.messages.map(m=>`<div class="card" style="margin-bottom:12px"><div class="b"><b>${esc(m.name)}</b> <span class="mut">· ${esc(m.email)} · ${esc(m.date)}</span><p>${esc(m.msg)}</p><button class="btn del sm" data-act="delm" data-id="${m.id}">Delete</button></div></div>`).join(''):'<p class="mut">No messages yet. Send one from the Contact page.</p>'}`}
function render(){const r=(location.hash.slice(1)||'home');const k=pages[r]?r:'home';
$('#app').innerHTML=pages[k]();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===k));
$('#brand').textContent=D.content.brand;const c=D.content;$('#foot').innerHTML=`© 2026 ${esc(c.brand)} · ${esc(c.email)} · ${esc(c.phone)}`;
document.title=c.brand+' – live preview';window.scrollTo(0,0)}
function rerender(){const y=scrollY;render();scrollTo(0,y)}
addEventListener('hashchange',()=>{S.edit=null;render()});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
if(id==='lf'){if($('#le').value.trim()==='admin@cleanbiz.demo'&&$('#lp').value==='admin123'){S.auth=true;try{sessionStorage.setItem('cb_auth','1')}catch(x){}rerender()}else toast('Wrong email or password')}
if(id==='cf'){D.messages.unshift({id:Date.now(),name:$('#n').value,email:$('#e').value,msg:$('#m').value,date:new Date().toISOString().slice(0,10)});save();e.target.reset();toast('Message sent')}
if(id==='pf'){const o={name:$('#pn').value,price:parseFloat($('#pp').value)||0,desc:$('#pd').value,items:$('#pi').value.split('\n').filter(x=>x.trim()),pub:$('#pu').checked};if(S.edit===0){D.products.push({id:Date.now(),emoji:'📦',img:S.img,...o})}else{const p=D.products.find(x=>x.id===S.edit);Object.assign(p,o);if(S.img)p.img=S.img}S.edit=null;S.img='';save();rerender();toast('Product saved')}
if(id==='wf'){['brand','heroT','heroS','aboutT','aboutB','mission','ownerName','ownerBio','email','phone','address','hours'].forEach(k=>D.content[k]=$('#c_'+k).value);save();rerender();toast('Changes saved')}});
document.addEventListener('change',e=>{if(e.target.id==='pf2'&&e.target.files[0]){const im=new Image(),fr=new FileReader();fr.onload=()=>{im.onload=()=>{const s=Math.min(1,600/im.width),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.img=cv.toDataURL('image/jpeg',.8);$('#pv').innerHTML=`<img class="thumb" style="width:80px;height:80px" src="${S.img}" alt="Preview">`};im.src=fr.result};fr.readAsDataURL(e.target.files[0])}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
if(t.dataset.tab){e.preventDefault();S.tab=t.dataset.tab;S.edit=null;rerender();return}
const a=t.dataset.act,id=+t.dataset.id;if(t.tagName==='A')e.preventDefault();
if(a==='logout'){S.auth=false;try{sessionStorage.removeItem('cb_auth')}catch(x){}rerender()}
if(a==='new'){S.edit=0;S.img='';rerender()}if(a==='cancel'){S.edit=null;S.img='';rerender()}
if(a==='edit'){S.edit=id;S.img='';rerender()}
if(a==='tog'){const p=D.products.find(x=>x.id===id);p.pub=!p.pub;save();rerender()}
if(a==='delp'&&confirm('Delete this product?')){D.products=D.products.filter(x=>x.id!==id);save();rerender()}
if(a==='delm'){D.messages=D.messages.filter(x=>x.id!==id);save();rerender()}});
render();
</script></body></html>
